<title>카드게임 맵 편집기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위 도구줄 + 왼쪽 팔레트 | 가운데 지도 | 오른쪽 속성·검사. 좁은 화면에서는 지도 아래로 쌓인다 */
:root{
  --bg:#eef0f2; --panel:#ffffff; --line:#d5dade; --fg:#1d2329; --muted:#5f6b76;
  --accent:#2e5f8a; --accent-ink:#ffffff; --canvas:#1b2026;
  --err:#b3261e; --err-bg:#fbe9e7; --warn:#8a5a00; --warn-bg:#fff4dc; --ok:#256b3a; --ok-bg:#e5f3e8;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c; --panel:#1c2228; --line:#2e363e; --fg:#e4e8ec; --muted:#93a0ab;
  --accent:#6fa3cf; --accent-ink:#0e1418; --canvas:#0d1013;
  --err:#ffb4ab; --err-bg:#3a1714; --warn:#f2c46b; --warn-bg:#33270f; --ok:#8fd19e; --ok-bg:#14301c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --panel:#1c2228; --line:#2e363e; --fg:#e4e8ec; --muted:#93a0ab;
  --accent:#6fa3cf; --accent-ink:#0e1418; --canvas:#0d1013;
  --err:#ffb4ab; --err-bg:#3a1714; --warn:#f2c46b; --warn-bg:#33270f; --ok:#8fd19e; --ok-bg:#14301c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.app{display:grid;grid-template-rows:auto 1fr;gap:10px;height:100%;min-height:560px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:-0.01em}
.file{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40ch}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.2}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:22px;background:var(--line)}
.main{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:12px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tools button[aria-pressed="true"],.pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.pal{display:flex;flex-direction:column;gap:3px}
.pal button{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 8px}
.sw{width:16px;height:16px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25);display:grid;place-items:center;font-size:10px;font-weight:700}
.pal small{color:var(--muted);margin-left:auto;font-family:var(--mono);font-size:11px}
.stage{position:relative;background:var(--canvas);border-radius:8px;overflow:hidden;min-height:320px;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:12px;color:#dfe5ea;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.zoom button{background:rgba(20,24,28,.8);color:#e4e8ec;border-color:#3a434c;padding:4px 9px}
label.f{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:6px;font-size:13px}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
textarea{resize:vertical;min-height:52px}
.fields{display:flex;flex-direction:column;gap:6px}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:13px}
.fam label{display:flex;gap:6px;align-items:center}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row input[type=number]{width:64px}
.muted{color:var(--muted);font-size:12px}
.msg{font-size:12.5px;padding:6px 8px;border-radius:5px;line-height:1.4}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){font-family:var(--mono);text-align:right}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.hint code{font-family:var(--mono);font-size:11px;word-break:break-word}
[hidden]{display:none !important}
.dialog > div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog textarea{min-height:200px;font-family:var(--mono);font-size:11px}
@media (max-width:980px){
  body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr);}
  .stage{height:62vh;order:-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="bar">
    <h1>맵 편집기</h1>
    <button id="bNew">새 맵</button>
    <label class="btn" for="fileIn">파일 열기</label>
    <input id="fileIn" type="file" accept=".json,application/json" hidden>
    <button id="bSample">예시 평원</button>
    <button id="bWorld">예시 전체맵</button>
    <span class="sep"></span>
    <button id="bSave" class="primary">내려받기 (.json)</button>
    <button id="bCopy">JSON 복사</button>
    <button id="bPaste">JSON 붙여넣기</button>
    <span class="sep"></span>
    <button id="bUndo" title="Ctrl+Z">되돌리기</button>
    <button id="bRedo" title="Ctrl+Y">다시 하기</button>
    <span class="sep"></span>
    <button id="bView" aria-pressed="false">쿼터뷰 보기</button>
    <span class="file" id="fileLabel"></span>
  </div>
  <div class="main">
    <aside class="panel" aria-label="도구">
      <section>
        <h2>도구</h2>
        <div class="tools" id="tools"></div>
        <p class="muted" style="margin:8px 0 0">오른쪽 클릭: 노드 지우기 · Esc: 길 잇기 멈춤 · 가운데 드래그 또는 Space+드래그: 화면 옮기기 · 휠: 확대</p>
      </section>
      <section id="brushBox">
        <h2>붓 크기</h2>
        <div class="row"><input id="brush" type="range" min="1" max="7" value="1" style="flex:1"><span id="brushV" class="muted">1</span></div>
      </section>
      <section>
        <h2 id="palTitle">지형</h2>
        <div class="pal" id="pal"></div>
      </section>
    </aside>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="zoom"><button id="zOut" aria-label="축소">−</button><button id="zFit">맞춤</button><button id="zIn" aria-label="확대">+</button></div>
      <div class="hud" id="hud">-</div>
    </div>
    <aside class="panel" aria-label="속성">
      <section>
        <h2>맵 정보</h2>
        <div class="fields">
          <label class="f">맵 id<input id="mId" type="text" spellcheck="false"></label>
          <label class="f">이름<input id="mName" type="text"></label>
          <label class="f">맵 단계<select id="mTier"><option value="1">1 (평원)</option><option value="2">2 (숲·산지)</option><option value="3">3 (늪지·설원)</option></select></label>
          <div class="muted">맵 기본 적 계열</div>
          <div class="fam" id="mFam"></div>
          <label class="f">랜덤 칸 후보<input id="mPool" type="text" spellcheck="false" placeholder="비우면 기본값"></label>
          <div class="muted hint">종류:가중치[:최대 개수] 를 쉼표로. 기본값 <code id="defPool"></code></div>
          <div class="row">크기 <input id="mW" type="number" min="3" max="200"> × <input id="mH" type="number" min="3" max="200"><button id="bResize">바꾸기</button></div>
        </div>
      </section>
      <section>
        <h2>고른 노드</h2>
        <div id="nodeBox" class="fields"></div>
      </section>
      <section>
        <h2>보기</h2>
        <label class="toggle"><input id="tGrid" type="checkbox" checked> 칸 구분선</label>
        <label class="toggle"><input id="tDist" type="checkbox"> 시작에서 걸음 수</label>
        <label class="toggle"><input id="tLinks" type="checkbox" checked> 길 보이기</label>
      </section>
      <section>
        <h2>랜덤 굴려 보기</h2>
        <label class="toggle"><input id="tPrev" type="checkbox"> 랜덤 칸 결과로 보기</label>
        <div class="row">시드 <input id="seed" type="number" min="1" value="1" style="width:90px"><button id="bRoll">다시 굴리기</button></div>
        <div id="prevBox" class="muted"></div>
      </section>
      <section>
        <h2>검사</h2>
        <div id="report" class="fields"></div>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="dialog" id="dlg" hidden><div>
  <strong id="dlgTitle"></strong>
  <div id="dlgBody" class="muted"></div>
  <textarea id="dlgText" hidden spellcheck="false"></textarea>
  <div class="row" style="justify-content:flex-end"><button id="dlgNo">취소</button><button id="dlgYes" class="primary">확인</button></div>
</div></div>

const DEFAULT_POOL='battle:40, elite:8:3, farm:15, event:20, totem:6:3, ruin_village:5:2, merchant_camp:4:1';
const ELITE_MIN_STEPS=6, SPREAD_RADIUS=2;
function parsePool(spec,bad){const out=[];
  for(const raw of (spec||'').split(',')){const part=raw.trim();if(!part)continue;const b=part.split(':');
    const e={type:b[0].trim(),weight:1,max:0};
    if(b.length>1&&/^\s*-?\d+\s*$/.test(b[1]))e.weight=Math.max(0,parseInt(b[1],10));
    if(b.length>2&&/^\s*-?\d+\s*$/.test(b[2]))e.max=Math.max(0,parseInt(b[2],10));
    const d=N(e.type);if(!d||d.random||e.type==='start'){if(bad)bad.push("'"+e.type+"'");continue;}out.push(e);}

function resolveRandom(seed){

  let s=(seed>>>0)||0x9E3779B9;const next=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s;};
  let st=null;for(const n of nodes)if(n.type==='start')st=n;
  const dist=st?distances(st.x,st.y):null;

  rnd.sort((a,b)=>a.y!==b.y?a.y-b.y:a.x-b.x);
  for(const n of rnd){const pool=poolOf(n);const w=[];let total=0;

      if(e.type==='elite'&&dist&&inB(n.x,n.y)&&dist[n.y][n.x]>=0&&dist[n.y][n.x]<ELITE_MIN_STEPS)v=0;
      if(v>0&&nodes.some(o=>o!==n&&o.type===e.type&&Math.abs(o.x-n.x)+Math.abs(o.y-n.y)<=SPREAD_RADIUS))v=e.weight;
      w.push(v);total+=v;}
    let chosen='battle';
    if(total>0){let r=next()%total;for(let i=0;i<pool.length;i++){if(r<w[i]){chosen=pool[i].type;break;}r-=w[i];}}
    n.type=chosen;n.pool='';n.fromRandom=true;counts[chosen]=(counts[chosen]||0)+1;}

    if(d&&d.random&&n.pool){const bad=[];if(!parsePool(n.pool,bad).length)bad.push('(쓸 수 있는 후보 없음, 맵 기본값을 써요)');if(bad.length)r.warn.push(label(n)+': 랜덤 후보에 모르는 종류 '+bad.join(', '));}}

  const ex=r.counts.exit||0; if(ex<2)r.warn.push('탈출 후보가 '+ex+'개예요. 탐험마다 2곳을 열려면 3곳 이상을 추천해요.');
  r.links=map.links.length;r.farHops=-1;
  if(!map.links.length){if(map.nodes.length>1)r.warn.push('노드끼리 이은 길이 아직 없어요. 길 도구(5)로 잇거나 \'자동 연결\'을 눌러 보세요.');}
  else if(starts[0]){const h=hops(starts[0]);
    for(const n of map.nodes){const k=h.get(n.x+','+n.y);if(k===undefined)r.err.push(label(n)+': 시작 지점에서 길로 이어져 있지 않아요.');else if(k>r.farHops)r.farHops=k;}}

const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
function resize(){const r=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function isoW(){return zoom*1.4;} // 쿼터뷰 마름모 가로
function cellToScreen(x,y){ // 칸 가운데 화면 좌표
  if(!iso)return [panX+(x+.5)*zoom,panY+(y+.5)*zoom];

}
function screenToCell(px,py){

function draw(){

      for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=dist[y][x];if(d>0&&!shownAt(x,y))ctx.fillText(d,panX+(x+.5)*zoom,panY+(y+.5)*zoom);}}

    const pad=Math.max(2,zoom/8);
    ctx.font='700 '+Math.max(9,zoom/2|0)+'px "IBM Plex Sans KR",sans-serif';
    for(const n of shownNodes()){const d=N(n.type),c=d?d.color:'#ff00ff';const x=panX+n.x*zoom,y=panY+n.y*zoom;
      ctx.fillStyle=c;ctx.fillRect(x+pad,y+pad,zoom-pad*2-gap,zoom-pad*2-gap);
      if(n.fromRandom){ctx.setLineDash([3,2]);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(x+pad-1.5,y+pad-1.5,zoom-pad*2-gap+3,zoom-pad*2-gap+3);ctx.setLineDash([]);}
      ctx.fillStyle=lum(c)>.6?'#000':'#fff';ctx.fillText(d?d.mark:'!',x+zoom/2,y+zoom/2+1);
      if(selected&&n.x===selected.x&&n.y===selected.y&&n!==selected){ctx.strokeStyle='#ffd400';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,zoom-2-gap,zoom-2-gap);}
      if(n===selected){ctx.strokeStyle='#ffd400';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,zoom-2-gap,zoom-2-gap);}}
    if(hover&&inB(hover[0],hover[1])){const r0=tool==='terrain'?(brush-1)>>1:0,r1=tool==='terrain'?brush>>1:0;
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1;ctx.strokeRect(panX+(hover[0]-r0)*zoom+.5,panY+(hover[1]-r0)*zoom+.5,(r0+r1+1)*zoom-gap-1,(r0+r1+1)*zoom-gap-1);}
  } else {

    for(let s=0;s<map.width+map.height-1;s++)for(let x=0;x<=s;x++){const y=s-x;if(!inB(x,y))continue;

          ctx.fillStyle=shade(t.color,-.32);ctx.beginPath();ctx.moveTo(cx+w/2,cy);ctx.lineTo(cx,cy+h/2);ctx.lineTo(cx,cy+h/2-lift);ctx.lineTo(cx+w/2,cy-lift);ctx.fill();
          ctx.fillStyle=t.color;diamond(cx,cy-lift,1);ctx.fill();}}
      if(!shownAt(x,y)&&dist&&dist[y][x]>0){ctx.font='500 '+Math.max(8,h*.4|0)+'px monospace';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(dist[y][x],cx,cy);}
    }

        if(n.fromRandom){ctx.setLineDash([3,2]);ctx.strokeStyle='#fff';ctx.lineWidth=1.2;diamond(cx,cy-h*.15,.62);ctx.stroke();ctx.setLineDash([]);}
        ctx.font='700 '+Math.max(8,h*.5|0)+'px "IBM Plex Sans KR",sans-serif';ctx.fillStyle=lum(c)>.6?'#000':'#fff';ctx.fillText(d?d.mark:'!',cx,cy-h*.13);
        if(selected&&n.x===selected.x&&n.y===selected.y){ctx.strokeStyle='#ffd400';ctx.lineWidth=2;diamond(cx,cy,1);ctx.stroke();}}
    if(hover&&inB(hover[0],hover[1])){const [cx,cy]=cellToScreen(hover[0],hover[1]);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.5;diamond(cx,cy,1);ctx.stroke();}

}
function drawLinks(pos,lw){

$('tPrev').onchange=e=>{preview=e.target.checked;updatePreview();draw();};
$('seed').oninput=e=>{seed=Math.max(1,parseInt(e.target.value,10)||1);if(preview){updatePreview();draw();}};
$('bRoll').onclick=()=>{seed=1+Math.floor(Math.random()*999999);$('seed').value=seed;preview=true;$('tPrev').checked=true;updatePreview();draw();};
function renderPreview(){const box=$('prevBox');const rc=map.nodes.filter(n=>N(n.type)&&N(n.type).random).length;
  if(!previewNodes){box.textContent=rc?'랜덤 칸 '+rc+'곳. 켜면 탐험 한 번의 결과를 미리 볼 수 있어요. (점선 테두리가 랜덤에서 나온 노드)':'랜덤 칸이 아직 없어요. 노드 도구에서 「랜」 칸을 찍으세요.';return;}
  const c={};previewNodes.filter(n=>n.fromRandom).forEach(n=>c[n.type]=(c[n.type]||0)+1);
  const parts=NODES.filter(d=>c[d.id]).map(d=>d.name+' '+c[d.id]);
  box.textContent='시드 '+seed+' · 랜덤 칸 '+rc+'곳 → '+(parts.join(', ')||'없음')+'. 같은 시드면 게임에서도 같은 결과예요.';}
$('mTier').onchange=e=>{snap();map.baseTier=+e.target.value;changed();};
$('bResize').onclick=()=>{const w=Math.max(3,Math.min(200,+$('mW').value||map.width)),h=Math.max(3,Math.min(200,+$('mH').value||map.height));
  snap();map.rows=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x<map.width&&y<map.height?map.rows[y][x]:'.').join(''));
  map.width=w;map.height=h;map.nodes=map.nodes.filter(n=>inB(n.x,n.y));if(selected&&!map.nodes.includes(selected))selected=null;changed();renderAll();fit();};
function field(labelText,el){const l=document.createElement('label');l.className='f';l.append(document.createTextNode(labelText),el);return l;}
function renderNode(){
  const box=$('nodeBox');box.replaceChildren();
  if(!selected||!map.nodes.includes(selected)){selected=null;const p=document.createElement('div');p.className='muted';p.textContent='선택 도구(3)로 노드를 눌러 고르세요.';box.append(p);return;}
  const n=selected,d=N(n.type),key='node'+map.nodes.indexOf(n);
  const pos=document.createElement('div');pos.className='muted';pos.textContent='('+n.x+', '+n.y+') · 지형 '+T(terr(n.x,n.y)).name;box.append(pos);
  const sel=document.createElement('select');sel.id='nType';NODES.forEach(o=>sel.add(new Option(o.name,o.id)));sel.value=n.type;
  sel.onchange=()=>{snap();n.type=sel.value;if(n.type==='start'){map.nodes=map.nodes.filter(o=>o===n||o.type!=='start');fixLinks();}changed();renderNode();refresh();};
  box.append(field('종류',sel));
  const nm=document.createElement('input');nm.type='text';nm.id='nName';nm.value=n.name;nm.oninput=()=>{snapOnce(key+'name');n.name=nm.value;changed();};box.append(field('이름',nm));
  if(d&&d.random){
    const pl=document.createElement('input');pl.type='text';pl.id='nPool';pl.spellcheck=false;pl.placeholder='비우면 맵 기본값';pl.value=n.pool||'';
    pl.oninput=()=>{snapOnce(key+'pool');n.pool=pl.value;changed();};box.append(field('이 칸 후보',pl));
    const m=document.createElement('div');m.className='muted';m.textContent='예) battle:3, farm:1 · 전투가 나오면 아래 설정을 써요';box.append(m);}
  if(d&&(d.battle||d.random)){
    const tc=T(terr(n.x,n.y)).cells;const bc=document.createElement('select');bc.id='nCells';[[0,'지형 기본 ('+tc+'칸)'],[5,'5칸'],[7,'7칸'],[9,'9칸']].forEach(([v,t])=>bc.add(new Option(t,v)));bc.value=String(n.battleCells|0);
    bc.onchange=()=>{snap();n.battleCells=+bc.value;changed();};box.append(field('전투 칸',bc));
    const df=document.createElement('select');df.id='nDiff';DIFFS.forEach(([v,t])=>df.add(new Option(t,v)));df.value=n.difficulty||'';
    df.onchange=()=>{snap();n.difficulty=df.value;changed();};box.append(field('난이도',df));
    const m=document.createElement('div');m.className='muted';m.textContent='적 계열 (모두 끄면 맵 기본값)';box.append(m);
    const f=document.createElement('div');f.className='fam';famBox(f,n.enemies,v=>{snapOnce(key+'en');n.enemies=v;changed();});box.append(f);}
  if(d&&d.target){const t=document.createElement('input');t.type='text';t.id='nTarget';t.spellcheck=false;t.value=n.target;t.oninput=()=>{snapOnce(key+'t');n.target=t.value.trim();changed();};box.append(field(n.type==='map_gate'?'갈 맵 id':'던전 id',t));}
  const note=document.createElement('textarea');note.id='nNote';note.value=n.note;note.oninput=()=>{snapOnce(key+'note');n.note=note.value;changed();};box.append(field('메모',note));
  const del=document.createElement('button');del.textContent='이 노드 지우기';del.onclick=()=>{snap();map.nodes=map.nodes.filter(o=>o!==n);dropLinksAt(n.x,n.y);selected=null;changed();renderNode();refresh();};box.append(del);
}
function renderReport(){
  const box=$('report');box.replaceChildren();const r=report;
  const msg=(cls,t)=>{const d=document.createElement('div');d.className='msg '+cls;d.textContent=t;box.append(d);};
  r.err.forEach(t=>msg('err',t));r.warn.forEach(t=>msg('warn',t));if(!r.err.length&&!r.warn.length)msg('ok','문제 없음');
  const s=document.createElement('div');s.className='stats';
  const add=(a,b)=>{const x=document.createElement('span');x.textContent=a;const y=document.createElement('span');y.textContent=b;s.append(x,y);};
  add('지나갈 수 있는 칸',r.walk);add('가장 먼 노드까지',r.far>=0?r.far+'걸음':'-');add('노드 수',map.nodes.length);add('길 수',r.links);if(r.links)add('가장 먼 노드까지 (길)',r.farHops>=0?r.farHops+'번 이동':'-');
  NODES.forEach(d=>{if(r.counts[d.id])add('  '+d.name,r.counts[d.id]);});box.append(s);
}
function changed(){report=check();if(preview)previewNodes=resolveRandom(seed);renderPreview();markDirty();draw();}
function refresh(){report=check();renderReport();renderMapInfo();draw();saveDraft();}
let draftTimer=0;
function markDirty(){dirty=true;$('fileLabel').textContent=(fileName||map.id+'.json')+' · 저장 안 됨';$('bUndo').disabled=!undo.length;$('bRedo').disabled=!redo.length;clearTimeout(draftTimer);draftTimer=setTimeout(()=>{saveDraft();renderReport();},300);}
function renderAll(){report=check();updatePreview();renderTools();renderMapInfo();renderNode();renderReport();$('bUndo').disabled=!undo.length;$('bRedo').disabled=!redo.length;draw();}
$('tGrid').onchange=e=>{showGrid=e.target.checked;draw();};
$('tDist').onchange=e=>{showDist=e.target.checked;draw();};
$('tLinks').onchange=e=>{showLinks=e.target.checked;draw();};
$('brush').oninput=e=>{brush=+e.target.value;$('brushV').textContent=brush;};
$('bView').onclick=()=>{iso=!iso;$('bView').setAttribute('aria-pressed',iso);$('bView').textContent=iso?'격자 보기':'쿼터뷰 보기';fit();};
$('bUndo').onclick=doUndo;$('bRedo').onclick=doRedo;

// ───── 파일 ─────
function load(m,name){map=normalize(m);fileName=name||'';selected=null;undo=[];redo=[];dirty=false;renderAll();fit();$('fileLabel').textContent=(fileName||map.id+'.json');saveDraft();}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400);}
function ask(title,body,{text=null,yes='확인'}={}){return new Promise(res=>{const d=$('dlg');$('dlgTitle').textContent=title;$('dlgBody').textContent=body;
  const ta=$('dlgText');ta.hidden=text===null;if(text!==null)ta.value=text;$('dlgYes').textContent=yes;d.hidden=false;if(text!==null)ta.focus();
  $('dlgYes').onclick=()=>{d.hidden=true;res(text===null?true:ta.value);};$('dlgNo').onclick=()=>{d.hidden=true;res(false);};});}
async function confirmDiscard(){return !dirty||await ask('저장하지 않은 변경이 있어요','지금 맵을 버리고 계속할까요? 먼저 내려받으려면 취소를 누르세요.',{yes:'버리고 계속'});}
$('fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!await confirmDiscard())return;
  try{load(JSON.parse(await f.text()),f.name);toast(f.name+'을 열었어요.');}catch(err){toast('맵 파일이 아니에요: '+err.message);}};
$('bSample').onclick=async()=>{if(await confirmDiscard()){load(SAMPLE,'plains.json');toast('예시 평원을 불러왔어요.');}};
$('bWorld').onclick=async()=>{if(await confirmDiscard()){load(WORLD,'wildlands.json');toast('예시 전체맵을 불러왔어요. 노드 105곳, 길 161개예요.');}};
$('bNew').onclick=async()=>{if(!await confirmDiscard())return;load(blank('new_map','새 맵',30,20),'');
  map.nodes.push({x:2,y:10,type:'start',name:'',battleCells:0,difficulty:'',enemies:'',target:'',note:''});refresh();};
let downloads=null;
(async()=>{try{downloads=window.claude&&await window.claude.use('downloads');}catch(e){downloads=null;}})();
async function save(){
  const name=(map.id||'map')+'.json';
  if(downloads){try{await downloads.save({filename:name,data:toJson()});dirty=false;renderMapInfo();toast(name+'을 내려받았어요. Unity의 Assets/Data/Maps 에 넣으세요.');return;}
    catch(e){if(e&&e.code==='declined'){toast('내려받기를 취소했어요.');return;}}}
  copy(true);
}
async function copy(fromSave){
  const txt=toJson();
  try{await navigator.clipboard.writeText(txt);if(fromSave){dirty=false;renderMapInfo();}toast('JSON을 복사했어요. 메모장에 붙여 '+(map.id||'map')+'.json 으로 저장하세요.');}
  catch(e){await ask('JSON 복사','아래 내용을 모두 선택해 복사하세요.',{text:txt,yes:'닫기'});}
}
$('bSave').onclick=save;$('bCopy').onclick=()=>copy(false);
$('bPaste').onclick=async()=>{const t=await ask('JSON 붙여넣기','맵 파일 내용을 붙여넣으세요. 지금 맵은 바뀌어요.',{text:'',yes:'불러오기'});
  if(!t)return;try{load(JSON.parse(t),'');toast('붙여넣은 맵을 불러왔어요.');}catch(err){toast('맵 형식이 아니에요: '+err.message);}};
function saveDraft(){try{localStorage.setItem('mapEditorDraft',JSON.stringify({map,fileName,dirty}));}catch(e){}}
window.addEventListener('beforeunload',saveDraft);

// ───── 시작 ─────
let draft=null;try{draft=JSON.parse(localStorage.getItem('mapEditorDraft')||'null');}catch(e){}
new ResizeObserver(resize).observe(stage);
if(draft&&draft.map){load(draft.map,draft.fileName);dirty=!!draft.dirty;renderMapInfo();}else load(SAMPLE,'plains.json');
</script>
